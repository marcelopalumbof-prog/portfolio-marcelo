<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcelo Palumbo - Reels Desktop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A0B0A; font-family: 'Inter', system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; background: #0A0B0A; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  .scene.active { opacity: 1; pointer-events: auto; }
  
  .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 100px 100px; opacity: 0.25; pointer-events: none; }
  
  .cursor { position: absolute; width: 26px; height: 26px; background: #E85D04; border-radius: 50%; box-shadow: 0 0 18px rgba(232,93,4,.8); pointer-events: none; z-index: 100; transform: translate(-50%, -50%); transition: transform 0.08s ease; }
  .ripple { position: absolute; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; pointer-events: none; z-index: 95; transform: translate(-50%, -50%) scale(0); opacity: 0; }
  
  .safe-top { position: absolute; top: 0; left: 0; width: 100%; height: 250px; background: #0A0B0A; z-index: 200; pointer-events: none; }
  .safe-bottom { position: absolute; bottom: 0; left: 0; width: 100%; height: 400px; background: #0A0B0A; z-index: 200; pointer-events: none; }
  
  .caption { position: absolute; left: 50%; transform: translateX(-50%); top: 520px; font-family: 'Syne', 'Unbounded', system-ui, sans-serif; font-weight: 800; font-size: 36px; color: #FFFFFF; text-align: center; max-width: 900px; line-height: 1.2; pointer-events: none; z-index: 150; opacity: 0; transition: opacity 0.4s ease; text-shadow: 0 4px 20px rgba(0,0,0,.7); }
  .caption.show { opacity: 1; }
  .caption .accent { color: #E85D04; }
  
  .sfx-tag { position: absolute; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 18px; color: #E85D04; pointer-events: none; z-index: 90; opacity: 0; transition: opacity 0.3s ease; padding: 6px 14px; border-radius: 999px; background: rgba(232,93,4,.15); border: 1px solid rgba(232,93,4,.4); }
  .sfx-tag.show { opacity: 1; }
  
  .logo { position: absolute; top: 60px; left: 60px; font-family: 'Syne', system-ui, sans-serif; font-weight: 700; font-size: 28px; color: #E85D04; letter-spacing: -0.02em; z-index: 150; opacity: 0; transition: opacity 0.5s ease; }
  .logo.show { opacity: 1; }
  
  .final-card { position: absolute; left: 50%; transform: translateX(-50%); bottom: 460px; width: 860px; text-align: center; padding: 70px 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,.14); background: linear-gradient(180deg,#151615,#0E0F0E); color: #FFFFFF; z-index: 150; opacity: 0; transition: opacity 0.8s ease; box-shadow: 0 40px 120px -40px rgba(0,0,0,.8); }
  .final-card.show { opacity: 1; }
  .final-card h2 { font-family: 'Syne', system-ui, sans-serif; font-weight: 800; font-size: 42px; margin-bottom: 14px; line-height: 1.1; }
  .final-card p { font-size: 18px; color: #8A8C8A; line-height: 1.5; margin-bottom: 26px; }
  .wa-btn { display: inline-flex; align-items: center; gap: 12px; padding: 18px 36px; background: #E85D04; color: #0A0B0A; font-weight: 700; font-size: 19px; border-radius: 16px; text-decoration: none; box-shadow: 0 12px 32px -8px rgba(232,93,4,.4); transition: transform 0.12s ease; }
  .wa-btn:active { transform: scale(.96); }
  .final-info { margin-top: 30px; font-size: 16px; color: #FFFFFF; }
  .final-info .accent { color: #E85D04; font-weight: 700; }
  
  .desktop-viewport { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.62); width: 1440px; min-height: 2560px; transform-origin: top center; z-index: 10; pointer-events: none; }
  
  .desktop-shadow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.62); width: 1520px; height: 2640px; background: rgba(0,0,0,.45); border-radius: 40px; filter: blur(40px); z-index: 8; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
  .desktop-shadow.show { opacity: 1; }
  
  .zoom-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center center; transition: transform 1s cubic-bezier(.05,.7,.1,1); }
  
  /* Iframe do site real */
  .site-iframe { position: absolute; top: 0; left: 0; width: 1440px; min-height: 2560px; border: none; background: #0A0B0A; }
  
  .zoom-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: center center; transition: transform 1s cubic-bezier(.05,.7,.1,1); }
  
  .site-loaded { opacity: 1 !important; transition: opacity 0.8s ease; }
</style>
</head>
<body>

<div class="safe-top"></div>
<div class="safe-bottom"></div>

<div class="logo" id="logo">Marcelo Palumbo<span style="color:#FFFFFF">.</span></div>

<div class="desktop-shadow" id="desktopShadow"></div>

<div class="desktop-viewport" id="desktopViewport">
  <div class="zoom-container" id="zoomContainer">
    <div class="desktop-shadow-inner" style="position:absolute;inset:0;background:rgba(0,0,0,.3);border-radius:30px;opacity:0.4;"></div>
    <iframe class="site-iframe" id="siteFrame" src="http://127.0.0.1:8099/index.html"></iframe>
  </div>
</div>

<div class="cursor" id="cursor"></div>
<div class="ripple" id="ripple"></div>

<div class="caption" id="caption"></div>
<div class="sfx-tag" id="sfx"></div>

<div class="final-card" id="finalCard">
  <h2>Marcelo Palumbo<span style="color:#FFFFFF">.</span></h2>
  <p>Orçamento direto no <span class="accent">WhatsApp</span>.</p>
  <a class="wa-btn" href="#">Falar no WhatsApp <span style="font-size:16px">→</span></a>
  <div class="final-info">
    <span class="accent">@marcelopalumbo_</span> · marcelopalumbo.vercel.app
  </div>
</div>

<script>
  const scenes = document.querySelectorAll('.scene');
  const cursor = document.getElementById('cursor');
  const ripple = document.getElementById('ripple');
  const caption = document.getElementById('caption');
  const sfx = document.getElementById('sfx');
  const zoomContainer = document.getElementById('zoomContainer');
  const siteFrame = document.getElementById('siteFrame');
  const logo = document.getElementById('logo');
  const desktopShadow = document.getElementById('desktopShadow');
  const finalCard = document.getElementById('finalCard');
  
  const WIDTH = 1080;
  const HEIGHT = 1920;
  const FPS = 30;
  const DURATION = 48;
  const TOTAL_FRAMES = DURATION * FPS;
  let frame = 0;
  let siteReady = false;
  
  function showScene(time) {
    scenes.forEach(sc => {
      const start = parseFloat(sc.getAttribute('data-start'));
      const end = parseFloat(sc.getAttribute('data-end'));
      if (time >= start && time < end) {
        sc.classList.add('active');
      } else {
        sc.classList.remove('active');
      }
    });
  }
  
  function setCaption(text, top = 520) {
    caption.style.top = top + 'px';
    caption.innerHTML = text;
    caption.classList.add('show');
  }
  
  function hideCaption() {
    caption.classList.remove('show');
  }
  
  function setSFX(text, x, y) {
    sfx.style.left = x + 'px';
    sfx.style.top = y + 'px';
    sfx.textContent = text;
    sfx.classList.add('show');
    setTimeout(() => sfx.classList.remove('show'), 700);
  }
  
  function moveCursor(x, y) {
    cursor.style.left = x + 'px';
    cursor.style.top = y + 'px';
  }
  
  function triggerRipple(x, y) {
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.transform = 'translate(-50%, -50%) scale(0)';
    ripple.style.opacity = '0';
    requestAnimationFrame(() => {
      ripple.style.transition = 'transform 0.5s cubic-bezier(.05,.7,.1,1), opacity 0.5s ease';
      ripple.style.transform = 'translate(-50%, -50%) scale(2.5)';
      ripple.style.opacity = '0.7';
      setTimeout(() => {
        ripple.style.transition = 'none';
        ripple.style.transform = 'translate(-50%, -50%) scale(0)';
        ripple.style.opacity = '0';
      }, 500);
    });
  }
  
  function setZoom(scale, x = 50, y = 50) {
    zoomContainer.style.transform = `scale(${scale}) translate(${-x}%, ${-y}%)`;
  }
  
  // Aguardar o iframe carregar
  siteFrame.addEventListener('load', () => {
    siteReady = true;
    console.log('Iframe do site carregado');
  });
  
  // Timeout de segurança
  setTimeout(() => { if(!siteReady) { siteReady = true; console.log('Timeout do iframe - continuando'); } }, 5000);
  
  function tick() {
    if (!siteReady) {
      requestAnimationFrame(tick);
      return;
    }
    
    const time = frame / FPS;
    showScene(time);
    
    logo.classList.add('show');
    desktopShadow.classList.add('show');
    
    // Cena 0-2.5: Logo apenas, fade in desktop
    if (time >= 0 && time < 2.5) {
      hideCaption();
      const p = Math.min(time / 2.5, 1);
      setZoom(0.62 + (0.05 * p));
    }
    
    // Cena 2.5-5.5: "Sites que vendem."
    if (time >= 2.5 && time < 5.5) {
      setCaption("Sites que <span class=\"accent\">vendem</span>.", 520);
      moveCursor(720 + Math.sin(time * 2) * 30, 960 + Math.cos(time * 1.5) * 20);
      setZoom(0.67);
    }
    
    // Cena 5.5-8.5: "Sistemas que organizam."
    if (time >= 5.5 && time < 8.5) {
      setCaption("Sistemas que <span class=\"accent\">organizam</span>.", 520);
      moveCursor(720 + Math.sin(time * 2 + 2) * 30, 960 + Math.cos(time * 1.5 + 2) * 20);
      setZoom(0.67);
    }
    
    // Cena 8.5-11.5: "Anúncios que trazem clientes."
    if (time >= 8.5 && time < 11.5) {
      setCaption("Anúncios que <span class=\"accent\">trazem clientes</span>.", 520);
      moveCursor(720 + Math.sin(time * 2 + 4) * 30, 960 + Math.cos(time * 1.5 + 4) * 20);
      setZoom(0.67);
    }
    
    // Cena 11.5-14.5: Hero - cursor no botão "Quero meu projeto"
    if (time >= 11.5 && time < 14.5) {
      setCaption("Quero meu projeto", 1050);
      moveCursor(520 + Math.sin(time) * 20, 1050);
      setZoom(0.70, 40, 45);
      if (frame === Math.round(11.5 * FPS)) triggerRipple(520, 1050);
    }
    
    // Cena 14.5-17.5: "+80 projetos entregues"
    if (time >= 14.5 && time < 17.5) {
      setCaption("+80 projetos entregues", 1000);
      moveCursor(520, 1050);
      setZoom(0.70, 40, 45);
      if (frame === Math.round(14.5 * FPS)) { triggerRipple(520, 1050); setSFX("pop", 520, 1050); }
    }
    
    // Cena 17.5-20.5: "★★★★★ 5,0"
    if (time >= 17.5 && time < 20.5) {
      setCaption("★★★★★ 5,0", 1080);
      moveCursor(520, 1050);
      setZoom(0.70, 40, 45);
    }
    
    // Cena 20.5-24.5: Scroll para Serviços
    if (time >= 20.5 && time < 24.5) {
      setCaption("Serviços", 1200);
      const p = (time - 20.5) / 4.0;
      moveCursor(720 + Math.sin(time * 3) * 40, 960 + Math.cos(time * 2) * 30);
      setZoom(0.65, 50, 50);
      // Simular scroll via JS no iframe
      try {
        const iframeDoc = siteFrame.contentDocument || siteFrame.contentWindow.document;
        if (iframeDoc) iframeDoc.scrollingElement.scrollTop = Math.min(1400 * p, 1400);
      } catch(e) {}
    }
    
    // Cena 24.5-28.5: Filtros portfólio
    if (time >= 24.5 && time < 28.5) {
      setCaption("Filtros: Todos → Sistemas → Tráfego pago", 1300);
      const p = (time - 24.5) / 4.0;
      const filters = ['.pf-filter[data-filter="all"]', '.pf-filter[data-filter="sistema"]', '.pf-filter[data-filter="trafego"]'];
      const fIdx = Math.min(Math.floor(p * 3), 2);
      
      try {
        const iframeDoc = siteFrame.contentDocument || siteFrame.contentWindow.document;
        if (iframeDoc) {
          filters.forEach(f => { const el = iframeDoc.querySelector(f); if(el) el.classList.remove('active'); });
          const filter = iframeDoc.querySelector(filters[fIdx]);
          if (filter) {
            const r = filter.getBoundingClientRect();
            // Ajustar coordenadas para o espaço da página principal
            const iframeRect = siteFrame.getBoundingClientRect();
            moveCursor(iframeRect.left + r.left + r.width/2, iframeRect.top + r.top + r.height/2);
            filter.classList.add('active');
          }
        }
      } catch(e) {}
      setZoom(0.68, 50, 55);
    }
    
    // Cena 28.5-32.5: Slider antes/depois Restaurante
    if (time >= 28.5 && time < 32.5) {
      setCaption("Antes / Depois", 1400);
      const p = (time - 28.5) / 4.0;
      const knobX = 720 + p * 200;
      moveCursor(knobX, 1150 + Math.sin(time * 4) * 10);
      try {
        const iframeDoc = siteFrame.contentDocument || siteFrame.contentWindow.document;
        if (iframeDoc) {
          const baRange = iframeDoc.querySelector('.ba-range');
          if (baRange) {
            const val = Math.round(55 + p * 40);
            baRange.value = val;
            baRange.dispatchEvent(new Event('input'));
          }
        }
      } catch(e) {}
      setZoom(0.70, 55, 60);
      if (frame === Math.round(28.5 * FPS)) { triggerRipple(720, 1150); setSFX("whoosh", 720, 1150); }
    }
    
    // Cena 32.5-34.5: Métrica R$ 4,20
    if (time >= 32.5 && time < 34.5) {
      setCaption("R$ 4,20 por R$ 1", 900);
      moveCursor(400 + Math.sin(time * 2) * 40, 700);
      setZoom(0.60, 30, 40);
      if (frame === Math.round(32.5 * FPS)) { triggerRipple(400, 700); setSFX("pop", 400, 700); }
    }
    
    // Cena 34.5-36.5: Métrica −38%
    if (time >= 34.5 && time < 36.5) {
      setCaption("−38% custo por lead", 900);
      moveCursor(700 + Math.sin(time * 2) * 40, 850);
      setZoom(0.60, 50, 45);
      if (frame === Math.round(34.5 * FPS)) { triggerRipple(700, 850); setSFX("pop", 700, 850); }
    }
    
    // Cena 36.5-38.5: Métrica +120
    if (time >= 36.5 && time < 38.5) {
      setCaption("+120 leads por mês", 900);
      moveCursor(400 + Math.sin(time * 2) * 40, 1000);
      setZoom(0.60, 30, 50);
      if (frame === Math.round(36.5 * FPS)) { triggerRipple(400, 1000); setSFX("pop", 400, 1000); }
    }
    
    // Cena 38.5-41.5: Abas planos
    if (time >= 38.5 && time < 41.5) {
      setCaption("Planos: Sites / Sistemas / Tráfego", 1200);
      const p = (time - 38.5) / 3.0;
      const tabs = ['.tab#tab-sites', '.tab#tab-sistemas', '.tab#tab-trafego'];
      
      try {
        const iframeDoc = siteFrame.contentDocument || siteFrame.contentWindow.document;
        if (iframeDoc) {
          tabs.forEach(t => { const el = iframeDoc.querySelector(t); if(el) el.classList.remove('active'); });
          const tIdx = Math.min(Math.floor(p * 3), 2);
          const tab = iframeDoc.querySelector(tabs[tIdx]);
          if (tab) {
            const r = tab.getBoundingClientRect();
            const iframeRect = siteFrame.getBoundingClientRect();
            moveCursor(iframeRect.left + r.left + r.width/2, iframeRect.top + r.top + r.height/2);
            tab.classList.add('active');
          }
        }
      } catch(e) {}
      setZoom(0.65, 50, 55);
      if (frame === Math.round(38.5 * FPS)) { triggerRipple(400, 1200); setSFX("clique", 400, 1200); }
    }
    
    // Cena 41.5-45.0: CTA WhatsApp
    if (time >= 41.5 && time < 45.0) {
      setCaption("Falar no WhatsApp", 1700);
      moveCursor(940, 1780);
      setZoom(0.55, 85, 90);
      if (frame === Math.round(41.5 * FPS)) { triggerRipple(940, 1780); setSFX("clique", 940, 1780); }
      finalCard.classList.add('show');
    }
    
    // Cena 45.0-48.0: Tela final
    if (time >= 45.0 && time <= 48.0) {
      hideCaption();
      setZoom(0.55, 85, 90);
      finalCard.classList.add('show');
    }
    
    frame++;
    if (frame <= TOTAL_FRAMES) {
      requestAnimationFrame(tick);
    }
  }
  
  requestAnimationFrame(tick);
</script>
</body>
</html>
